<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Sound Walk HAKODATE AI </title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    
    #app-container { display: flex; width: 100vw; height: 100vh; }
    
    #sidebar { width: 380px; min-width: 380px; height: 100%; padding: 20px; overflow-y: auto; background: #ffffff; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #e2e8f0; box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 10; }
    h1 { font-size: 20px; margin: 0; color: #0284c7; display: flex; align-items: center; gap: 8px; }
    .section-title { font-size: 13px; font-weight: bold; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    label { font-size: 13px; color: #334155; display: block; margin-bottom: 4px; font-weight: bold; }
    input[type="text"], select { width: 100%; padding: 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; color: #0f172a; font-size: 14px; margin-bottom: 12px; }
    input[type="text"]:focus, select:focus { outline: none; border-color: #0284c7; background: #fff; }

    .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { padding: 6px 12px; background: #e2e8f0; color: #334155; border-radius: 20px; font-size: 12px; cursor: pointer; user-select: none; transition: all 0.2s; font-weight: 500; }
    .tag.active { background: #0284c7; color: white; font-weight: bold; }
    
    .btn { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
    .card:hover { border-color: #0284c7; transform: translateY(-1px); }
    .card-title { font-weight: bold; font-size: 15px; color: #0f172a; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #64748b; }
    
    #map { flex: 1; width: 100%; height: 100%; background: #e2e8f0; }
    #aiResult { background: #f0f9ff; border: 1px solid #0284c7; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #0369a1; display: none; }
  </style>
</head>
<body>

<div id="app-container">
  <div id="sidebar">
    <h1> Sound Walk HAKODATE AI</h1>

    <!-- 条件選択 -->
    <div>
      <div class="section-title">1. 条件を入力してAIコースを作成</div>
      
      <label for="moodInput">今日の気分（自由入力）</label>
      <input type="text" id="moodInput" placeholder="例: 人混み">

      <label for="timeSelect">散歩したい時間</label>
      <select id="timeSelect">
        <option value="15" selected>15分（サクッと短時間）</option>
        <option value="30">30分（お手軽コース）</option>
        <option value="60">60分（じっくり散策）</option>
        <option value="90">90分以上（函館満喫コース）</option>
      </select>

      <label>楽しみたい音の要素（タップで選択）</label>
      <div class="tags-container" id="soundTags">
        <span class="tag active" data-type="train">🚋 市電・電車</span>
        <span class="tag active" data-type="car">🚗 車・街音</span>
        <span class="tag active" data-type="nature">🌿 自然・公園</span>
        <span class="tag active" data-type="people">🗣️ 賑わい・人の声</span>
        <span class="tag active" data-type="sea">🌊 海・水音</span>
        <span class="tag active" data-type="airplane">✈️ 飛行機</span>
      </div>

      <button class="btn" onclick="generateAiCourse()">✨ AIで散歩コースを作成</button>
    </div>

    <div id="aiResult"></div>

    <!-- スポット一覧 -->
    <div>
      <div class="section-title">2. サウンドスポット一覧</div>
      <div id="spotList">データを読み込み中...</div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
  // スポットデータ
  const SPOTS_DATA = [
    { id: "spot1", title: "ベイエリアの市電の音", desc: "電車の賑やかな音", lat: 41.7720854, lng: 140.727309, category: "train" },
    { id: "spot2", title: "朝市の車の音", desc: "賑やかな音（函館朝市）", lat: 41.7725, lng: 140.7238, category: "car" },
    { id: "spot3", title: "五稜郭公園", desc: "静かな自然の音", lat: 41.7968, lng: 140.7570, category: "nature" },
    { id: "spot4", title: "五稜郭タワー", desc: "賑やかな人の声や館内アナウンス", lat: 41.7946, lng: 140.7540, category: "people" },
    { id: "spot5", title: "噴水の音", desc: "自然の中の落ち着きのある綺麗な音", lat: 41.75738, lng: 140.71666, category: "sea,people" },
    { id: "spot6", title: "自然の音", desc: "自然の静かな音", lat: 41.8492109, lng: 140.7602815, category: "nature" },
    { id: "spot7", title: "ヒースガーデン", desc: "自然の静かな音", lat: 41.8492109, lng: 140.7602815, category: "nature" },
    { id: "spot8", title: "飛行機", desc: "飛行機の音", lat: 41.76719, lng: 140.82399, category: "airplane" },
    { id: "spot9", title: "本町", desc: "賑やかな人の音（本町交差点周辺）", lat: 41.7895, lng: 140.7525, category: "people" },
    { id: "spot10", title: "ひょうたん池公園", desc: "小鳥の囀りや森のせせらぎ", lat: 41.75555, lng: 140.71425, category: "sea" },
    { id: "spot11", title: "こどもの国の子供の声", desc: "子どもの賑わっている声", lat: 41.75672, lng: 140.71644, category: "people" }
  ];

  let map;
  let markers = [];
  let routePolyline;

  // 地図の初期化
  function initMap() {
    const mapElement = document.getElementById("map");
    
    map = new google.maps.Map(mapElement, {
      center: { lat: 41.775, lng: 140.730 },
      zoom: 13
    });

    document.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        tag.classList.toggle('active');
        renderSpots();
      });
    });

    renderSpots();
  }

  // ピンとリストを描画
  function renderSpots() {
    markers.forEach(m => m.setMap(null));
    markers = [];

    const activeCategories = Array.from(document.querySelectorAll('.tag.active')).map(t => t.dataset.type);
    const listEl = document.getElementById("spotList");
    listEl.innerHTML = "";

    SPOTS_DATA.forEach(spot => {
      const spotCats = (spot.category || "").split(",").map(c => c.trim());
      const isMatch = spotCats.some(cat => activeCategories.includes(cat));

      if (!isMatch && activeCategories.length > 0) return;

      const latNum = parseFloat(spot.lat);
      const lngNum = parseFloat(spot.lng);

      if (!isNaN(latNum) && !isNaN(lngNum)) {
        const marker = new google.maps.Marker({
          position: { lat: latNum, lng: lngNum },
          map: map,
          title: spot.title
        });

        marker.addListener("click", () => {
          map.setCenter(marker.getPosition());
          map.setZoom(16);
        });

        markers.push(marker);
      }

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => {
        map.setCenter({ lat: latNum, lng: lngNum });
        map.setZoom(16);
      };
      card.innerHTML = `
        <div class="card-title">${spot.title}</div>
        <div class="card-desc">${spot.desc}</div>
      `;
      listEl.appendChild(card);
    });
  }

  // Gemini AIでコース生成
  async function generateAiCourse() {
    const mood = document.getElementById("moodInput").value.trim() || "人混み";
    const walkTime = document.getElementById("timeSelect").value;
    const activeTags = Array.from(document.querySelectorAll('.tag.active')).map(t => t.innerText).join(', ');
    
    const resultDiv = document.getElementById("aiResult");
    const GEMINI_API_KEY = "AQ.Ab8RN6IYTsMiA4SeZA5NQsEJyltZdDlQ6WtxzWpq-yX6qpn_-Q"; 

    resultDiv.style.display = "block";
    resultDiv.innerHTML = "🤖 Geminiが道沿いの最適な散歩コースを作成中...";

    const prompt = `
    あなたは函館の観光・散歩コースのエキスパートです。
    ユーザーの気分: 「${mood}」
    散歩時間: 約 ${walkTime} 分間
    選択された音要素: ${activeTags}
    
    以下のスポット候補から、必ず【2〜4箇所】選択しておすすめの巡り順と解説を作成してください。
    スポット候補: ${JSON.stringify(SPOTS_DATA.map(s => ({ id: s.id, title: s.title, desc: s.desc, lat: s.lat, lng: s.lng })))}
    
    【出力フォーマット】
    JSON形式のみで出力してください。必ずrouteIdsには2箇所以上のIDを含めてください。
    {
      "courseTitle": "コース名",
      "routeIds": ["spot2", "spot1"],
      "explanation": "解説文"
    }
    `;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json"
          }
        })
      });

      if (!response.ok) {
        throw new Error(`API Error: ${response.status}`);
      }

      const data = await response.json();
      const rawText = data.candidates[0].content.parts[0].text;
      const aiResponse = JSON.parse(rawText);

      resultDiv.innerHTML = `
        <strong>💡 ${aiResponse.courseTitle}</strong>
        <p style="margin: 6px 0;">${aiResponse.explanation}</p>
      `;

      fetchOsrmRoadRoute(aiResponse.routeIds);

    } catch (err) {
      console.error("Gemini API Error:", err);
      resultDiv.innerHTML = "コースの自動生成に失敗しました。";
    }
  }

  // OSRM (Open Source Routing Machine) APIを使って実際の道沿い経路を取得・描画
  async function fetchOsrmRoadRoute(routeIds) {
    if (routePolyline) routePolyline.setMap(null);

    const selectedSpots = (routeIds || []).map(id => SPOTS_DATA.find(s => s.id === id)).filter(Boolean);
    if (selectedSpots.length < 2) return;

    // OSRMは 経度(lng),緯度(lat) の順番で渡す必要があります
    const coordinatesStr = selectedSpots.map(s => `${s.lng},${s.lat}`).join(';');
    const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${coordinatesStr}?overview=full&geometries=geojson`;

    try {
      const res = await fetch(osrmUrl);
      const resData = await res.json();

      if (resData.code === 'Ok' && resData.routes.length > 0) {
        // OSRMから返された道路に正確に沿った座標配列（[lng, lat]）
        const routeCoords = resData.routes[0].geometry.coordinates;
        const path = routeCoords.map(coord => ({ lat: coord[1], lng: coord[0] }));

        routePolyline = new google.maps.Polyline({
          path: path,
          geodesic: true,
          strokeColor: "#0284c7",
          strokeOpacity: 0.85,
          strokeWeight: 6
        });

        routePolyline.setMap(map);

        // 道路全体が収まるようにカメラ画角を調整
        const bounds = new google.maps.LatLngBounds();
        path.forEach(p => bounds.extend(p));
        map.fitBounds(bounds);
      }
    } catch (err) {
      console.error("OSRM Route Error:", err);
    }
  }
</script>

<!-- Google Maps Script -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA3lI6MvfcK1aruEOyGFRmvhKjRrBFmQqU&callback=initMap&loading=async" async defer></script>
</body>
</html>
